spring.datasource.username=postgres
#spring.datasource.password=BlogTecSoftwareLLP@2025
spring.datasource.password=postgres


# ==========18================================
# \uD83E\uDDE9 Hibernate / JPA Configuration
# ==========================================
#spring.jpa.hibernate.ddl-auto=drop
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.hibernate.ddl-auto=create
#spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false
spring.jpa.show-sql = false
# ==========================================
# \uD83D\uDE80 Hikari Connection Pool
# ==========================================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=300000




spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

system.user.name=BLOGTEC
system.user.password=Blogtec@123
app.init.enabled=true
# ==========================================
# 📊 Logging Configuration
# ==========================================
# Suppress redundant "Resolved [RemoteBranchException: ...]" warnings in the console
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=ERROR
##===========================================

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true


